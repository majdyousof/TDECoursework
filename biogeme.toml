# Default parameter file for Biogeme 3.2.14
# Automatically created on November 25, 2024. 12:21:32

[Biogeme]
version = "3.2.14" # Version of Biogeme that created the TOML file. Do not modify

[SimpleBounds]
second_derivatives = 1.0 # float: proportion (between 0 and 1) of iterations when the analytical Hessian is calculated
tolerance = 0.0001220703125 # float: the algorithm stops when this precision is reached
max_iterations = 1000 # int: maximum number of iterations
infeasible_cg = "False" # If True, the conjugate gradient algorithm may generate infeasible solutions until termination.
initial_radius = 1 # Initial radius of the trust region
steptol = 1e-05 # The algorithm stops when the relative change in x is below this threshold.
enlarging_factor = 10 # If an iteration is very successful, the radius of the trust region is multiplied by this factor

[Estimation]
bootstrap_samples = 100 # int: number of re-estimations for bootstrap sampling.
large_data_set = 100000 # If the number of observations is larger than this value, the data set is deemed large.
max_number_parameters_to_report = 15 # int: maximum number of parameters to report during the estimation.
save_iterations = "False" # bool: If True, current iterate is saved to __[modelName].iter
maximum_number_catalog_expressions = 100 # If the expression contains catalogs, this sets an upper bound.
optimization_algorithm = "automatic" # str: optimization algorithm to be used for estimation.

[AssistedSpecification]
maximum_number_parameters = 50 # int: maximum number of parameters allowed in a model.
number_of_neighbors = 20 # int: maximum number of neighbors that are visited by the VNS algorithm.
largest_neighborhood = 20 # int: size of the largest neighborhood considered by the VNS algorithm.
maximum_attempts = 100 # int: total attempts before termination.

[MonteCarlo]
number_of_draws = 100 # int: Number of draws for Monte-Carlo integration.
seed = 0 # int: Seed used for the pseudo-random number generation.

[Specification]
missing_data = 99999 # number: If one variable has this value, it is assumed to be missing.

[MultiThreading]
number_of_threads = 0 # int: Number of threads/processors to be used. If 0, the number of available threads is calculated.

[Output]
identification_threshold = 1e-05 # float: if the smallest eigenvalue of the second derivative matrix is lesser or equal to this parameter, the model is considered not identified.
only_robust_stats = "True" # bool: "True" if only the robust statistics need to be reported.
generate_html = "False" # bool: "True" if the HTML file with the results must be generated.
generate_pickle = "False" # bool: "True" if the pickle file with the results must be generated.

[TrustRegion]
dogleg = "True" # bool: choice of the method to solve the trust region subproblem.
