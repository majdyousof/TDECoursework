[project]
name = "tde-coursework"
version = "0.1.0"
description = "Transport Demand and Economics coursework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "biogeme==3.2.14",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pytest>=8.0",
  "scipy>=1.11",
]

[project.scripts]
analysis = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
]
